<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">开始使用 HelloLynk 的三步</title>
  <desc id="desc">第一步选择客户端并按说明安装插件。第二步在客户端打开 HelloLynk，连接自己的灵信号并到官网确认这台电脑。第三步添加联系人，对方同意后开始沟通。</desc>
  <rect width="1200" height="430" rx="28" fill="#fff8ec"/>
  <g fill="#282727" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="44" y="76" font-size="38" font-weight="700">从安装到第一条消息</text>
    <rect x="53" y="125" width="332" height="214" rx="23" fill="#282727"/>
    <rect x="44" y="116" width="332" height="214" rx="23" fill="#d5e7f8" stroke="#282727" stroke-width="3"/>
    <circle cx="91" cy="165" r="25" fill="#fff8ec" stroke="#282727" stroke-width="2.5"/>
    <text x="91" y="175" font-size="27" text-anchor="middle" font-weight="700">1</text>
    <text x="73" y="234" font-size="32" font-weight="700">选客户端</text>
    <text x="73" y="284" font-size="23">按对应说明安装插件</text>
    <path d="M388 224h34m-9-9 9 9-9 9" fill="none" stroke="#282727" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="443" y="125" width="332" height="214" rx="23" fill="#282727"/>
    <rect x="434" y="116" width="332" height="214" rx="23" fill="#f8dfa0" stroke="#282727" stroke-width="3"/>
    <circle cx="481" cy="165" r="25" fill="#fff8ec" stroke="#282727" stroke-width="2.5"/>
    <text x="481" y="175" font-size="27" text-anchor="middle" font-weight="700">2</text>
    <text x="463" y="234" font-size="32" font-weight="700">打开并连接</text>
    <text x="463" y="284" font-size="23">在客户端打开 HelloLynk</text>
    <path d="M778 224h34m-9-9 9 9-9 9" fill="none" stroke="#282727" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="833" y="125" width="332" height="214" rx="23" fill="#282727"/>
    <rect x="824" y="116" width="332" height="214" rx="23" fill="#f5d2dc" stroke="#282727" stroke-width="3"/>
    <circle cx="871" cy="165" r="25" fill="#fff8ec" stroke="#282727" stroke-width="2.5"/>
    <text x="871" y="175" font-size="27" text-anchor="middle" font-weight="700">3</text>
    <text x="853" y="234" font-size="32" font-weight="700">添加联系人</text>
    <text x="853" y="284" font-size="23">对方同意后开始沟通</text>
    <text x="44" y="390" font-size="22">连接自己的灵信号，到官网确认这台电脑；已确认的电脑无需重复操作。</text>
  </g>
</svg>
